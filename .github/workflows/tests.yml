name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install headless rendering libs (mujoco needs GL)
        run: sudo apt-get update && sudo apt-get install -y libosmesa6 libgl1 libglx-mesa0

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          MUJOCO_GL: osmesa
        run: pytest tests/
