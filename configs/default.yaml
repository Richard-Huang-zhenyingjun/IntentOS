# Intent Interface Configuration

# Robot parameters
robot:
  max_joint_vel_rad_s: 2.5
  position_gain: 0.3
  settle_threshold: 0.01
  
  # Thresholds
  min_ee_height: 0.15
  reach_distance: 0.15
  grasp_distance: 0.10
  
  # Place location
  place_position: [0.0, 0.0, 0.65]

# Cube
cube_urdf: "cube_small.urdf"

# Input
input:
  keyboard:
    debounce_seconds: 0.3
  
  eeg:
    window_seconds: 1.5
    cooldown_seconds: 1.5
    confirm_threshold: 70.0

# Recovery
recovery:
  enabled: true

# UI
ui:
  show_overlay: true
